name: Windows tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # release.yml runs this same job, so a release is built and tested exactly as CI does
  workflow_call:
    inputs:
      release:
        description: Upload the release files (installer, blockmap, latest.yml, zip) for the release job
        type: boolean
        default: false
      sign:
        description: Also upload the packaged folder for SignPath to sign OpenPub.exe in (release.yml, once signing is set up)
        type: boolean
        default: false
    outputs:
      app-artifact-id:
        description: ID of the uploaded packaged folder (when sign is true), for the SignPath signing request
        value: ${{ jobs.test.outputs.app-artifact-id }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 75 # about 20 for the tests and packaging, plus the Windows App Certification Kit
    outputs:
      app-artifact-id: ${{ steps.app.outputs.artifact-id }}
    env:
      # make the desktop tests fail, not skip, if an inspection tool is missing
      OPENPUB_REQUIRE_ALL: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22' # the minimum in package.json engines
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/appsrc/package-lock.json

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      # The tests call python3 by name; add it if this Python build does not have one.
      - name: Add python3 and install pikepdf
        run: |
          $py3 = Join-Path $env:pythonLocation 'python3.exe'
          if (-not (Test-Path $py3)) { Copy-Item (Join-Path $env:pythonLocation 'python.exe') $py3 }
          python3 -m pip install pikepdf
          python3 -c "import pikepdf; print('pikepdf', pikepdf.__version__)"

      - name: Install poppler 25.07
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'poppler.zip'
          Invoke-WebRequest 'https://github.com/oschwartz10612/poppler-windows/releases/download/v25.07.0-0/Release-25.07.0-0.zip' -OutFile $zip
          # SHA-256 published with the release asset
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash
          if ($hash -ne '435E6265738470B7AE6498B8A298A4025BACB9349656207EF54D0F069687CE57') { throw "Unexpected poppler zip: SHA-256 $hash" }
          Expand-Archive $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'poppler')
          $bin = Join-Path $env:RUNNER_TEMP 'poppler\poppler-25.07.0\Library\bin'
          Add-Content $env:GITHUB_PATH $bin
          & (Join-Path $bin 'pdfinfo.exe') -v

      # Ghostscript is AGPL: installed here for the tests, never bundled with the app.
      # The official installer hangs on the runner even with /S, so unpack it with 7-Zip
      # into the folder the installer would use (the app looks in Program Files\gs).
      - name: Install Ghostscript 10.08
        timeout-minutes: 5
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'gs10080w64.exe'
          Invoke-WebRequest 'https://github.com/ArtifexSoftware/ghostpdl-downloads/releases/download/gs10080/gs10080w64.exe' -OutFile $exe
          "downloaded: $((Get-Item $exe).Length) bytes"
          # SHA-256 published with the release asset, then the Authenticode signature
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          if ($hash -ne '52A91B8BF09298788D7A57B9206127026C23EACD75405F0A131E26DC381DCE50') { throw "Unexpected Ghostscript installer: SHA-256 $hash" }
          $sig = Get-AuthenticodeSignature $exe
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'Artifex Software') { throw "Unexpected signature: $($sig.Status) $($sig.SignerCertificate.Subject)" }
          "signature: $($sig.Status), $($sig.SignerCertificate.Subject)"
          $dest = 'C:\Program Files\gs\gs10.08.0'
          7z x $exe "-o$dest" -y -bso0 -bsp0
          if ($LASTEXITCODE -ne 0) { throw "7-Zip failed with exit code $LASTEXITCODE" }
          $gs = Join-Path $dest 'bin\gswin64c.exe'
          if (-not (Test-Path $gs)) { Get-ChildItem $dest | Format-Table Name; throw 'gswin64c.exe not found after unpacking' }
          & $gs --version

      - name: Install dependencies
        run: npm ci

      - name: Browser tests
        run: npm run test:web

      - name: Desktop tests
        run: npm run test:desktop

      - name: Parser run over the sample files
        run: npm run test:parser

      - name: Package (folder, zip and installer)
        run: npm run package:win

      # release.yml with signing set up: the packaged folder, as built and before any test runs it, for SignPath to
      # sign OpenPub.exe in (the release job then builds the installer and zip again from the signed folder)
      - name: Upload the packaged folder for signing
        id: app
        if: ${{ inputs.sign }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-unsigned
          path: desktop/dist/OpenPub-win32-x64/
          retention-days: 1
          if-no-files-found: error

      # the packaged (asar) app: command-line file, dictionary, fonts, CMYK through Ghostscript, no network
      - name: Packaged smoke test
        run: node tools/smoke-packaged.js

      # installs silently per user and per machine, opens files through the associations, uninstalls
      - name: Installer tests
        run: npm run test:installer

      # the Microsoft Store package: test-signed with a throwaway certificate, installed, checked inside the package
      # (Store mode, data redirected and removed on uninstall, file types, alias, Ghostscript, PDF), uninstalled, then
      # put through the Windows App Certification Kit (in the runner image's Windows SDK)
      - name: MSIX tests
        timeout-minutes: 45
        run: npm run test:msix
      # The unsigned Store package for Partner Center (the Store signs it). desktop/build/store.json holds placeholder
      # values until the owner adds the reserved identity, and a package built with them cannot be submitted.
      - name: Upload Store package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OpenPub-store-package
          path: desktop/dist/OpenPub-*-x64.msix
          retention-days: 7
          compression-level: 0
          if-no-files-found: error

      # For trying out a pull request's build. Artifacts expire; releases (with the installer
      # and zip attached) are the downloads for users.
      - name: Upload installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OpenPub-installer
          path: desktop/dist/OpenPub-*-win64-setup.exe
          retention-days: 7
          compression-level: 0
          if-no-files-found: error

      # release.yml only: everything the release needs, checked against latest.yml first
      - name: Check release files
        if: ${{ inputs.release }}
        run: node tools/release-files.js desktop/dist

      - name: Upload release files
        if: ${{ inputs.release }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: |
            desktop/dist/OpenPub-*-win64-setup.exe
            desktop/dist/OpenPub-*-win64-setup.exe.blockmap
            desktop/dist/latest.yml
            desktop/dist/OpenPub-*-win64.zip
          retention-days: 7
          compression-level: 0
          if-no-files-found: error

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-out
          path: test-out/
          retention-days: 7
          if-no-files-found: ignore
