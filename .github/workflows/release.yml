name: Release

# Makes a DRAFT release of the version in desktop/appsrc/package.json. Start it by hand on main after the
# version bump is merged (Actions > Release > Run workflow). The owner checks the draft and publishes it;
# publishing creates the tag. Releases are immutable once published: a broken release is fixed by a new version.
#
#   rehearsal: builds and publishes a draft tagged v<version>-rehearsal.<run>, marked "do not publish".
#              Check it, then delete it. Never publish a rehearsal.
#
# Code signing (SignPath Foundation) is off until the owner sets it up (docs/SIGNING.md); then the sign job runs:
#   repository variable SIGNPATH_ORGANIZATION_ID   turns signing on
#   repository secret   SIGNPATH_API_TOKEN         API token of a SignPath user with the submitter role
#   optional variables  SIGNPATH_PROJECT_SLUG (default OpenPub), SIGNPATH_RELEASE_POLICY (release-signing),
#                       SIGNPATH_TEST_POLICY (test-signing, used by rehearsals)
# Each signing request waits for approval in SignPath, and the run waits with it.
on:
  workflow_dispatch:
    inputs:
      rehearsal:
        description: Rehearsal (draft marked do-not-publish; delete it afterwards)
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      signing: ${{ steps.s.outputs.signing }}
      policy: ${{ steps.s.outputs.policy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: v
        name: Version, tag and release notes can be made
        env:
          GH_TOKEN: ${{ github.token }}
          REHEARSAL: ${{ inputs.rehearsal }}
        run: |
          set -eu
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then echo "::error::Run the release workflow on main (this run: $GITHUB_REF)"; exit 1; fi
          version=$(node -p "require('./desktop/appsrc/package.json').version")
          for f in package.json; do
            v=$(node -p "require('./$f').version"); [ "$v" = "$version" ] || { echo "::error::$f says $v, desktop/appsrc/package.json says $version"; exit 1; }
          done
          grep -q "OP.VERSION = '$version'" app/src/app-plugins.js || { echo "::error::OP.VERSION in app/src/app-plugins.js is not $version"; exit 1; }
          head -1 desktop/README-win.txt | grep -q "^OpenPub $version " || { echo "::error::desktop/README-win.txt does not start with OpenPub $version"; exit 1; }
          if [ "$REHEARSAL" = "true" ]; then
            tag="v$version-rehearsal.$GITHUB_RUN_NUMBER"
            node tools/release-notes.js "$version" --rehearsal > /dev/null
          else
            tag="v$version"
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" > /dev/null 2>&1; then echo "::error::Tag $tag already exists: bump the version first"; exit 1; fi
            node tools/release-notes.js "$version" > /dev/null
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Release $tag from $(git rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - id: s
        name: Signing set up?
        env:
          ORG: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          TOKEN_SET: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
          RELEASE_POLICY: ${{ vars.SIGNPATH_RELEASE_POLICY || 'release-signing' }}
          TEST_POLICY: ${{ vars.SIGNPATH_TEST_POLICY || 'test-signing' }}
          REHEARSAL: ${{ inputs.rehearsal }}
        run: |
          set -eu
          if [ -z "$ORG" ]; then
            echo "signing=false" >> "$GITHUB_OUTPUT"
            echo "Not code-signed: SignPath is not set up (repository variable SIGNPATH_ORGANIZATION_ID)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          [ "$TOKEN_SET" = "true" ] || { echo "::error::SIGNPATH_ORGANIZATION_ID is set but the SIGNPATH_API_TOKEN secret is not"; exit 1; }
          if [ "$REHEARSAL" = "true" ]; then policy="$TEST_POLICY"; else policy="$RELEASE_POLICY"; fi
          echo "signing=true" >> "$GITHUB_OUTPUT"
          echo "policy=$policy" >> "$GITHUB_OUTPUT"
          echo "Signed through SignPath with the policy $policy: two signing requests (OpenPub.exe, then the installer). Approve each one in SignPath; the sign job waits up to 2 hours for each." >> "$GITHUB_STEP_SUMMARY"

  # Exactly the CI job: every test, the package, the smoke and installer tests. Uploads the release files, and the
  # packaged folder for signing when signing is set up.
  build:
    needs: check
    permissions:
      contents: read
    uses: ./.github/workflows/windows.yml
    with:
      release: true
      sign: ${{ needs.check.outputs.signing == 'true' }}

  # Only when signing is set up. Every job before it runs on GitHub-hosted runners (SignPath Foundation's rule).
  # 1. SignPath signs OpenPub.exe in the packaged folder the build job uploaded (artifact configuration "app")
  # 2. the installer and zip are built again from the signed folder; app-update.yml names the certificate, so from
  #    this release on, an update installs only if it is signed with that certificate
  # 3. SignPath signs the installer (artifact configuration "installer")
  # 4. the signed installer gets a new .blockmap, and latest.yml its new SHA-512 and size
  # The artifact configurations are copied in .signpath/artifact-configurations; keep them the same as SignPath's.
  sign:
    needs: [check, build]
    if: ${{ needs.check.outputs.signing == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 300 # two approvals of up to 2 hours each
    permissions:
      actions: read # SignPath reads this run's job details and downloads the artifacts with this job's token
      contents: read
    defaults:
      run:
        shell: pwsh
    env:
      VERSION: ${{ needs.check.outputs.version }}
      REHEARSAL: ${{ inputs.rehearsal }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/appsrc/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Sign OpenPub.exe (SignPath, waits for approval)
        uses: SignPath/github-action-submit-signing-request@a2c5b60d9c75f073142b653c354b632eedce097b # v3.2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'OpenPub' }}
          signing-policy-slug: ${{ needs.check.outputs.policy }}
          artifact-configuration-slug: app
          github-artifact-id: ${{ needs.build.outputs.app-artifact-id }}
          parameters: |
            version: ${{ toJSON(needs.check.outputs.version) }}
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: desktop/dist/OpenPub-win32-x64

      # a rehearsal is signed with SignPath's test certificate, which Windows does not trust: it only has to be signed
      - name: Check the signature of OpenPub.exe
        id: cert
        run: |
          $sig = Get-AuthenticodeSignature -LiteralPath 'desktop/dist/OpenPub-win32-x64/OpenPub.exe'
          if (-not $sig.SignerCertificate) { throw "OpenPub.exe is not signed ($($sig.Status))" }
          if ($env:REHEARSAL -ne 'true' -and $sig.Status -ne 'Valid') { throw "OpenPub.exe signature: $($sig.Status) $($sig.StatusMessage)" }
          "OpenPub.exe: $($sig.Status), $($sig.SignerCertificate.Subject)"
          "publisher=$($sig.SignerCertificate.Subject)" >> $env:GITHUB_OUTPUT
          "- OpenPub.exe signed ($($sig.Status)) by $($sig.SignerCertificate.Subject)" >> $env:GITHUB_STEP_SUMMARY

      - name: Build the installer and zip from the signed folder
        env:
          PUBLISHER: ${{ steps.cert.outputs.publisher }}
        run: |
          node tools/package.mjs win32 --from-folder --publisher "$env:PUBLISHER"
          if ($LASTEXITCODE -ne 0) { throw 'package.mjs failed' }

      - name: Upload the installer for signing
        id: installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-unsigned
          path: desktop/dist/OpenPub-${{ needs.check.outputs.version }}-win64-setup.exe
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

      - name: Sign the installer (SignPath, waits for approval)
        uses: SignPath/github-action-submit-signing-request@a2c5b60d9c75f073142b653c354b632eedce097b # v3.2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'OpenPub' }}
          signing-policy-slug: ${{ needs.check.outputs.policy }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.installer.outputs.artifact-id }}
          parameters: |
            version: ${{ toJSON(needs.check.outputs.version) }}
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: signed-installer

      - name: Check the installer's signature, then remake its blockmap and latest.yml
        run: |
          $name = "OpenPub-$env:VERSION-win64-setup.exe"
          $sig = Get-AuthenticodeSignature -LiteralPath "signed-installer/$name"
          if (-not $sig.SignerCertificate) { throw "The installer is not signed ($($sig.Status))" }
          if ($env:REHEARSAL -ne 'true' -and $sig.Status -ne 'Valid') { throw "Installer signature: $($sig.Status) $($sig.StatusMessage)" }
          "- Installer signed ($($sig.Status)) by $($sig.SignerCertificate.Subject)" >> $env:GITHUB_STEP_SUMMARY
          Copy-Item -LiteralPath "signed-installer/$name" -Destination "desktop/dist/$name" -Force
          node tools/release-signed.js desktop/dist $env:VERSION
          if ($LASTEXITCODE -ne 0) { throw 'release-signed.js failed' }

      - name: Upload the signed release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files-signed
          path: |
            desktop/dist/OpenPub-*-win64-setup.exe
            desktop/dist/OpenPub-*-win64-setup.exe.blockmap
            desktop/dist/latest.yml
            desktop/dist/OpenPub-*-win64.zip
          retention-days: 7
          compression-level: 0
          if-no-files-found: error

  publish:
    needs: [check, build, sign]
    # after the build, and after signing when it is set up (the sign job is skipped otherwise)
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.check.outputs.signing != 'true' || needs.sign.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # the only job that can write: it creates the draft release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.check.outputs.signing == 'true' && 'release-files-signed' || 'release-files' }}
          path: release-files

      - name: Check the files against latest.yml
        run: node tools/release-files.js release-files "${{ needs.check.outputs.version }}"

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
          TAG: ${{ needs.check.outputs.tag }}
          REHEARSAL: ${{ inputs.rehearsal }}
          SIGNED: ${{ needs.check.outputs.signing }}
        run: |
          set -eu
          signed=""; if [ "$SIGNED" = "true" ]; then signed="--signed"; fi
          if [ "$REHEARSAL" = "true" ]; then
            node tools/release-notes.js "$VERSION" --rehearsal $signed > notes.md; title="REHEARSAL OpenPub $VERSION (do not publish)"
          else
            node tools/release-notes.js "$VERSION" $signed > notes.md; title="OpenPub $VERSION"
          fi
          gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "$title" --notes-file notes.md \
            "release-files/OpenPub-$VERSION-win64-setup.exe" \
            "release-files/OpenPub-$VERSION-win64-setup.exe.blockmap" \
            "release-files/latest.yml" \
            "release-files/OpenPub-$VERSION-win64.zip"
          url=$(gh release view "$TAG" --json url --jq .url)
          {
            echo "## Draft release ready"
            echo
            echo "[$title]($url): check it, then publish it (publishing creates the tag $TAG)."
            # an if, not "test && echo": as the last command, a false test would fail the step
            if [ "$REHEARSAL" = "true" ]; then echo "This is a rehearsal: delete the draft, never publish it."; fi
          } >> "$GITHUB_STEP_SUMMARY"
