<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenPub Poster Studio</title>
<style>
/* Layout idea: a prepress desk. Quiet graphite/paper chrome around the page, with the two
   colours every print worker knows doing the talking: cyan for guides, magenta for margins. */
:root {
  --panel: #f7f5f0;
  --panel-2: #ece9e2;
  --paste: #c9c5bc;
  --ink: #1d1c19;
  --ink-2: #625e56;
  --line: #d8d3c8;
  --field: #ffffff;
  --accent: #0a6c96;
  --accent-ink: #ffffff;
  --guide: #00a0d6;
  --margin: #d4249b;
  --warn: #b3261e;
  --sel: #0a84c9;
  --shadow: rgba(40, 34, 20, 0.22);
  --font-ui: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "IBM Plex Mono", Consolas, "Cascadia Mono", monospace;
  --font-display: "IBM Plex Sans Condensed", "Arial Narrow", "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --panel: #262521; --panel-2: #302e29; --paste: #151412; --ink: #ecebe6; --ink-2: #a39f95; --line: #3d3a34;
    --field: #1b1a17; --accent: #35a7d8; --accent-ink: #06202c; --guide: #2fc0f2; --margin: #f05cc0; --warn: #ff8a80;
    --sel: #45b4f0; --shadow: rgba(0, 0, 0, 0.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --panel: #262521; --panel-2: #302e29; --paste: #151412; --ink: #ecebe6; --ink-2: #a39f95; --line: #3d3a34;
  --field: #1b1a17; --accent: #35a7d8; --accent-ink: #06202c; --guide: #2fc0f2; --margin: #f05cc0; --warn: #ff8a80;
  --sel: #45b4f0; --shadow: rgba(0, 0, 0, 0.6);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--panel); color: var(--ink); font: 13px/1.35 var(--font-ui); overflow: hidden; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.num, input[type="number"] { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

#app { display: grid; grid-template-rows: auto auto 1fr auto; height: 100%; min-width: 0; }

/* ---- menu bar */
#menubar { display: flex; align-items: center; gap: 4px; padding: 0 10px 0 12px; height: 40px; border-bottom: 1px solid var(--line); background: var(--panel); min-width: 0; }
.brand { display: flex; align-items: center; gap: 8px; font: 600 17px/1 var(--font-display); letter-spacing: 0.02em; margin-right: 10px; white-space: nowrap; }
.brand svg { width: 20px; height: 20px; color: var(--ink); }
.brand b { color: var(--margin); font-weight: 600; }
.menu { position: relative; }
.menu > button { border: 0; background: none; padding: 6px 9px; border-radius: 5px; }
.menu > button:hover, .menu.open > button { background: var(--panel-2); }
.menu-list { display: none; position: absolute; top: 100%; left: 0; z-index: 50; min-width: 230px; padding: 5px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 10px 28px var(--shadow); }
.menu.open .menu-list { display: block; }
.menu-list button { display: flex; width: 100%; justify-content: space-between; gap: 24px; align-items: center; border: 0; background: none; padding: 6px 10px; border-radius: 5px; text-align: left; white-space: nowrap; }
.menu-list button:hover { background: var(--accent); color: var(--accent-ink); }
.menu-list button:hover kbd { color: inherit; }
.menu-list hr { border: 0; border-top: 1px solid var(--line); margin: 5px 4px; }
kbd { font: 11px var(--font-mono); color: var(--ink-2); }
#docname { flex: 1 1 120px; min-width: 60px; max-width: 320px; margin-left: 10px; border: 1px solid transparent; background: none; padding: 5px 8px; border-radius: 5px; font-weight: 500; text-overflow: ellipsis; }
#docname:hover, #docname:focus { border-color: var(--line); background: var(--field); }
.spacer { flex: 1; }
.btn { border: 1px solid var(--line); background: var(--field); padding: 5px 11px; border-radius: 6px; white-space: nowrap; }
.btn:hover { border-color: var(--ink-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--warn); }
.btn:disabled { opacity: 0.45; cursor: default; }

/* ---- toolbar */
#toolbar { display: flex; align-items: center; gap: 4px; padding: 5px 10px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; min-height: 42px; }
.tb-group { display: flex; align-items: center; gap: 2px; padding-right: 8px; margin-right: 4px; border-right: 1px solid var(--line); }
.tb-group:last-child { border-right: 0; }
.tool { display: inline-flex; align-items: center; gap: 6px; height: 30px; min-width: 30px; padding: 0 7px; border: 1px solid transparent; background: none; border-radius: 6px; white-space: nowrap; }
.tool svg { width: 18px; height: 18px; flex: none; }
.tool:hover { background: var(--panel-2); }
.tool.on { background: var(--ink); color: var(--panel); }
.tool:disabled { opacity: 0.35; cursor: default; background: none; }
.tool .lbl { font-size: 12.5px; }
#zoomlbl { min-width: 52px; text-align: center; font: 12px var(--font-mono); }
.pop { position: relative; }
.pop-panel { display: none; position: absolute; top: calc(100% + 4px); left: 0; z-index: 40; padding: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 10px 28px var(--shadow); }
.pop.open .pop-panel { display: grid; grid-template-columns: repeat(6, 38px); gap: 4px; }
.shape-btn { width: 38px; height: 38px; border: 1px solid transparent; background: none; border-radius: 6px; padding: 5px; }
.shape-btn:hover { background: var(--panel-2); border-color: var(--line); }
.shape-btn svg { width: 100%; height: 100%; }

/* ---- main area */
#main { display: grid; grid-template-columns: 132px minmax(0, 1fr) 272px; min-height: 0; }
#pages { border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
.pane-head { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px 6px; font: 600 11px/1 var(--font-ui); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); }
#pagelist { flex: 1; overflow-y: auto; padding: 4px 10px 10px; display: flex; flex-direction: column; gap: 10px; }
.thumb { border: 0; background: none; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.thumb canvas { max-width: 100%; background: #fff; box-shadow: 0 1px 4px var(--shadow); outline: 2px solid transparent; outline-offset: 2px; }
.thumb.on canvas { outline-color: var(--sel); }
.thumb span { font: 11px var(--font-mono); color: var(--ink-2); }
.pagebtns { display: flex; gap: 2px; padding: 6px 8px; border-top: 1px solid var(--line); justify-content: center; }
.icon-btn { width: 26px; height: 26px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid transparent; background: none; border-radius: 5px; padding: 0; }
.icon-btn:hover { background: var(--panel-2); }
.icon-btn.on { background: var(--ink); color: var(--panel); }
.icon-btn svg { width: 16px; height: 16px; }
.icon-btn:disabled { opacity: 0.35; cursor: default; }

#stage { position: relative; overflow: hidden; background: var(--paste); min-height: 0; touch-action: none; }
#cv, #ov { position: absolute; left: 20px; top: 20px; }
#ov { cursor: default; }
#rulerH { position: absolute; left: 20px; top: 0; height: 20px; }
#rulerV { position: absolute; left: 0; top: 20px; width: 20px; }
#rulerC { position: absolute; left: 0; top: 0; width: 20px; height: 20px; background: var(--panel); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); font: 9px/20px var(--font-mono); text-align: center; color: var(--ink-2); }
#edwrap { position: absolute; left: 20px; top: 20px; right: 0; bottom: 0; overflow: hidden; pointer-events: none; }
#ted { position: absolute; left: 0; top: 0; transform-origin: 0 0; outline: none; pointer-events: auto; display: flex; flex-direction: column; overflow: visible; white-space: pre-wrap; overflow-wrap: break-word; cursor: text; box-shadow: 0 0 0 1px var(--sel); caret-color: #000; color: #000; font-kerning: normal; }
#ted > div { min-height: 1em; }
#ted > div.bul::before { content: "\2022\00a0\00a0"; }
#ted { counter-reset: opn; }
#ted > div:not(.num) { counter-reset: opn; }
#ted > div.num { counter-increment: opn; }
#ted > div.num::before { content: counter(opn) ".\00a0\00a0"; }
#drop { position: absolute; inset: 20px 0 0 20px; display: none; align-items: center; justify-content: center; background: color-mix(in srgb, var(--accent) 22%, transparent); border: 3px dashed var(--accent); font: 600 20px var(--font-display); color: var(--ink); pointer-events: none; z-index: 5; }
#stage.dragging #drop { display: flex; }

/* ---- side panel */
#side { border-left: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
.tabs { display: flex; border-bottom: 1px solid var(--line); }
.tabs button { flex: 1; border: 0; background: none; padding: 9px 4px 8px; font-weight: 600; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); border-bottom: 2px solid transparent; }
.tabs button.on { color: var(--ink); border-bottom-color: var(--margin); }
#props, #layers { flex: 1; overflow-y: auto; padding: 4px 12px 16px; }
.sec { padding: 10px 0 12px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 7px; }
.sec:last-child { border-bottom: 0; }
.sec h3 { margin: 0 0 1px; font: 600 11px/1.2 var(--font-ui); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); }
.row { display: flex; align-items: center; gap: 6px; min-width: 0; }
.row > label { flex: 0 0 62px; color: var(--ink-2); font-size: 12px; }
.row.wrap { flex-wrap: wrap; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.f { display: flex; align-items: center; gap: 0; flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 5px; background: var(--field); height: 27px; }
.f:focus-within { border-color: var(--accent); }
.f > span { padding: 0 6px; color: var(--ink-2); font: 11px var(--font-mono); white-space: nowrap; }
.f > span.pre { padding-right: 2px; min-width: 20px; }
.f input, .f select { flex: 1; min-width: 0; width: 100%; border: 0; background: none; padding: 0 6px; height: 25px; outline: none; }
.f input[type="number"] { -moz-appearance: textfield; padding-right: 0; }
.f input[type="number"]::-webkit-inner-spin-button { opacity: 0.4; }
select { height: 27px; border: 1px solid var(--line); border-radius: 5px; background: var(--field); padding: 0 4px; min-width: 0; }
.f select { border: 0; height: 25px; }
input[type="color"] { width: 32px; height: 27px; padding: 1px; border: 1px solid var(--line); border-radius: 5px; background: var(--field); flex: none; }
input[type="range"] { flex: 1; min-width: 0; accent-color: var(--accent); }
input[type="checkbox"] { accent-color: var(--accent); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--field); }
.seg button { border: 0; background: none; width: 28px; height: 25px; display: inline-flex; align-items: center; justify-content: center; padding: 0; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button:hover { background: var(--panel-2); }
.seg button.on { background: var(--ink); color: var(--panel); }
.seg svg { width: 15px; height: 15px; }
.seg button.txt { font: 600 13px var(--font-ui); }
.hint { color: var(--ink-2); font-size: 12px; margin: 0; }
.note { background: var(--panel-2); border-left: 3px solid var(--margin); padding: 7px 9px; border-radius: 0 5px 5px 0; font-size: 12px; }

.layer { display: flex; align-items: center; gap: 4px; padding: 3px 4px; border-radius: 5px; border: 1px solid transparent; }
.layer:hover { background: var(--panel-2); }
.layer.on { background: color-mix(in srgb, var(--sel) 18%, transparent); border-color: color-mix(in srgb, var(--sel) 45%, transparent); }
.layer .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border: 0; background: none; text-align: left; padding: 3px 2px; }
.layer .kind { width: 16px; height: 16px; flex: none; color: var(--ink-2); }
.layer .icon-btn { width: 22px; height: 22px; color: var(--ink-2); }
.layer .dim { opacity: 0.3; }

/* ---- status bar (the slug line) */
#status { display: flex; align-items: center; gap: 14px; padding: 0 12px; height: 26px; border-top: 1px solid var(--line); background: var(--panel); font: 11.5px var(--font-mono); color: var(--ink-2); white-space: nowrap; overflow: hidden; }
#status .bar { display: flex; gap: 2px; }
#status .bar i { width: 10px; height: 10px; display: block; }
#stmsg { overflow: hidden; text-overflow: ellipsis; }

/* ---- dialogs & toasts */
#modal { position: fixed; inset: 0; z-index: 100; display: none; align-items: center; justify-content: center; background: rgba(20, 18, 14, 0.45); padding: 16px; }
#modal.open { display: flex; }
.dlg { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 24px 60px var(--shadow); width: min(520px, 100%); max-height: 100%; display: flex; flex-direction: column; }
.dlg.wide { width: min(680px, 100%); }
.dlg header { padding: 14px 18px 10px; font: 600 19px/1.2 var(--font-display); letter-spacing: 0.01em; text-wrap: balance; }
.dlg .body { padding: 2px 18px 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
.dlg .body p { margin: 0; max-width: 65ch; }
.dlg .body ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }
.dlg footer { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 18px 14px; border-top: 1px solid var(--line); }
.dlg .row > label { flex-basis: 132px; }
.dlg table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
.dlg td { padding: 3px 8px 3px 0; vertical-align: top; }
.dlg td:first-child { white-space: nowrap; }
.progress { height: 6px; border-radius: 3px; background: var(--panel-2); overflow: hidden; }
.progress i { display: block; height: 100%; width: 0; background: var(--accent); transition: width 0.15s; }
#toasts { position: fixed; left: 50%; bottom: 42px; transform: translateX(-50%); z-index: 120; display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; }
.toast { background: var(--ink); color: var(--panel); padding: 8px 14px; border-radius: 7px; box-shadow: 0 8px 22px var(--shadow); max-width: min(560px, 90vw); }
.toast.err { background: var(--warn); color: #fff; }
.blkgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.blk { display: flex; flex-direction: column; align-items: center; gap: 5px; width: 100%; padding: 6px 4px 7px; border: 1px solid var(--line); border-radius: 7px; background: var(--field); font-size: 12px; }
.blk:hover { border-color: var(--accent); }
.dlg textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.tilegrid { display: grid; gap: 2px; background: var(--line); border: 1px solid var(--line); align-self: flex-start; }
.tilegrid i { display: block; background: var(--field); font: 10px var(--font-mono); font-style: normal; color: var(--ink-2); text-align: center; }

@media (max-width: 860px) {
  #main { grid-template-columns: 0 minmax(0, 1fr) 236px; }
  #pages { display: none; }
  .tool .lbl { display: none; }
}
@media (max-width: 560px) {
  #main { grid-template-columns: 0 minmax(0, 1fr) 0; grid-template-rows: minmax(0, 1fr) 42%; }
  #side { grid-column: 1 / -1; border-left: 0; border-top: 1px solid var(--line); }
  .brand span { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div id="app">
  <div id="menubar">
    <div class="brand" title="OpenPub Poster Studio">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="6.5"/><path d="M12 1.5v21M1.5 12h21"/></svg>
      <span>Open<b>Pub</b></span>
    </div>
    <div id="menus" style="display:flex;gap:2px"></div>
    <input id="docname" type="text" aria-label="Document name" spellcheck="false">
    <div class="spacer"></div>
    <button class="btn" id="btnOpen" type="button">Open .pub…</button>
    <button class="btn primary" id="btnExport" type="button">Export…</button>
  </div>
  <div id="toolbar"></div>
  <div id="main">
    <aside id="pages" aria-label="Pages">
      <div class="pane-head"><span>Pages</span></div>
      <div id="pagelist"></div>
      <div class="pagebtns" id="pagebtns"></div>
    </aside>
    <section id="stage" aria-label="Page editor">
      <canvas id="cv"></canvas>
      <canvas id="ov"></canvas>
      <div id="edwrap"></div>
      <canvas id="rulerH"></canvas>
      <canvas id="rulerV"></canvas>
      <div id="rulerC">mm</div>
      <div id="drop">Drop a .pub file, project or picture</div>
    </section>
    <aside id="side">
      <div class="tabs" role="tablist">
        <button type="button" id="tabProps" class="on" role="tab">Properties</button>
        <button type="button" id="tabLayers" role="tab">Layers</button>
      </div>
      <div id="props"></div>
      <div id="layers" hidden></div>
    </aside>
  </div>
  <div id="status">
    <div class="bar" aria-hidden="true"><i style="background:#00a0d6"></i><i style="background:#d4249b"></i><i style="background:#f3d21b"></i><i style="background:#1d1c19"></i></div>
    <span id="stpage"></span><span id="stpos"></span><span id="stsel"></span><span id="stmsg"></span>
  </div>
</div>
<div id="modal"></div>
<div id="toasts"></div>
<input type="file" id="fileOpen" accept=".pub,.json,.opub,application/json" hidden>
<input type="file" id="fileImage" accept="image/*" multiple hidden>
<datalist id="fontlist"></datalist>
<script>
// ===== util.js
/* OpenPub – small shared helpers. */
var OP = (typeof globalThis.OP !== 'undefined') ? globalThis.OP : (globalThis.OP = {});

(function () {
  'use strict';

  /** zlib-inflate a byte array (browser + Node 18+). */
  OP.inflate = function (bytes) {
    if (typeof DecompressionStream === 'undefined') return Promise.reject(new Error('This browser cannot decompress data'));
    var ds = new DecompressionStream('deflate');
    var blob = new Blob([bytes]);
    return new Response(blob.stream().pipeThrough(ds)).arrayBuffer().then(function (ab) { return new Uint8Array(ab); });
  };

  /** zlib-deflate a byte array (the format PDF's FlateDecode expects). */
  OP.deflate = function (bytes) {
    if (typeof CompressionStream === 'undefined') return Promise.reject(new Error('This browser cannot compress data'));
    return new Response(new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate'))).arrayBuffer().then(function (ab) { return new Uint8Array(ab); });
  };

  OP.bytesToBase64 = function (bytes) {
    var s = '', CH = 0x8000;
    for (var i = 0; i < bytes.length; i += CH) s += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
    return btoa(s);
  };
  OP.bytesToDataUrl = function (bytes, mime) { return 'data:' + mime + ';base64,' + OP.bytesToBase64(bytes); };
  OP.dataUrlToBytes = function (url) {
    var i = url.indexOf(','), head = url.slice(0, i), body = url.slice(i + 1);
    if (/;base64/i.test(head)) {
      var bin = atob(body), out = new Uint8Array(bin.length);
      for (var k = 0; k < bin.length; k++) out[k] = bin.charCodeAt(k);
      return out;
    }
    return new TextEncoder().encode(decodeURIComponent(body));
  };
  OP.dataUrlMime = function (url) { var m = /^data:([^;,]+)/.exec(url); return m ? m[1] : ''; };

  var uidN = 0;
  OP.uid = function (prefix) {
    uidN++;
    return (prefix || 'i') + Date.now().toString(36) + uidN.toString(36) + Math.floor(Math.random() * 1296).toString(36);
  };
  OP.clamp = function (v, a, b) { return v < a ? a : (v > b ? b : v); };
  OP.clone = function (o) { return JSON.parse(JSON.stringify(o)); };
  OP.MM = 72 / 25.4; // points per millimetre
  OP.round = function (v, d) { var k = Math.pow(10, d === undefined ? 2 : d); return Math.round(v * k) / k; };
  OP.escXml = function (s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  };
})();

;
// ===== cfb.js
/* OpenPub – OLE2 / Compound File Binary reader (written from scratch, MS-CFB layout). */
var OP = (typeof globalThis.OP !== 'undefined') ? globalThis.OP : (globalThis.OP = {});

(function () {
  'use strict';

  var ENDOFCHAIN = 0xFFFFFFFE, FREESECT = 0xFFFFFFFF, MAXREG = 0xFFFFFFFA;
  var SIG = [0xD0, 0xCF, 0x11, 0xE0, 0xA1, 0xB1, 0x1A, 0xE1];

  function isCFB(bytes) {
    if (!bytes || bytes.length < 512) return false;
    for (var i = 0; i < 8; i++) if (bytes[i] !== SIG[i]) return false;
    return true;
  }

  /**
   * Parse a compound file.
   * @param {Uint8Array} bytes
   * @returns {{entries:Object[], get:function(string):Uint8Array|null, list:function():string[]}}
   */
  function readCFB(bytes) {
    if (!isCFB(bytes)) throw new Error('Not an OLE compound file (bad signature)');
    var dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
    var u16 = function (o) { return dv.getUint16(o, true); };
    var u32 = function (o) { return dv.getUint32(o, true); };

    var sectorShift = u16(0x1E), miniShift = u16(0x20);

    $('btnExport').addEventListener('click', function () { A.dlgExport(); });
    $('fileOpen').addEventListener('change', function () {
      var f = this.files && this.files[0];
      this.value = '';
      if (f) A.openFile(f);
    });
    $('fileImage').addEventListener('change', function () {
      var files = Array.prototype.slice.call(this.files || []);
      this.value = '';
      if (files.length) A.insertImageFiles(files);
    });
    var dn = $('docname');
    dn.addEventListener('change', function () {
      var v = dn.value.trim() || 'Untitled';
      dn.value = v;
      if (v !== S.doc.name) { S.doc.name = v; A.commit(); A.setTitle(); }
    });
    dn.addEventListener('keydown', function (e) { if (e.key === 'Enter') dn.blur(); });
    $('modal').addEventListener('pointerdown', function (e) { if (e.target === $('modal')) A.closeModal(); });

    var stage = $('stage'), first = true;
    function onResize() {
      A.resize();
      if (first) { first = false; A.fit(); A.zoomLabel(); }
    }
    if (window.ResizeObserver) new ResizeObserver(onResize).observe(stage);
    else window.addEventListener('resize', onResize);
    if (window.matchMedia) {
      var mq = window.matchMedia('(prefers-color-scheme: dark)');
      if (mq.addEventListener) mq.addEventListener('change', A.themeChanged);
    }
    OP.onImageLoad(function () { A.invalidate(); A.refreshPagesSoon(); });
    if (document.fonts && document.fonts.addEventListener) {
      document.fonts.addEventListener('loadingdone', function () { OP.resetTextMetrics(); A.invalidate(); });
    }
    if (!OP.desktop) window.addEventListener('beforeunload', function (e) { if (S.dirty) { e.preventDefault(); e.returnValue = ''; } });
    A.setTitle();

    if (OP.desktop) {
      OP.desktop.initialFile().then(function (f) {
        if (f && f.bytes) A.openFile(f); else readAutosave().then(welcome);
      }, function () { readAutosave().then(welcome); });
    } else readAutosave().then(welcome);
  };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', A.init);
  else A.init();
})();

</script>
</body>
</html>
